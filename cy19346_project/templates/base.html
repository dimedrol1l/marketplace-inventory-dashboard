<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Остатки и заказы{% endblock %}</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17212b; background: #f4f6f8; }
        body { margin: 0; }
        header, main { max-width: 1100px; margin: auto; padding: 1rem 1.25rem; }
        header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
        header a { color: #165d9c; }
        main { padding-top: 0; }
        section, .summary-card { background: white; border: 1px solid #dce2e8; border-radius: .6rem; padding: 1rem; margin: 1rem 0; }
        .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .75rem; }
        .summary-card strong { display: block; font-size: 1.5rem; margin-top: .25rem; }
        form.inline { display: inline; }
        label { display: block; margin: .65rem 0 .2rem; }
        input { box-sizing: border-box; max-width: 100%; padding: .5rem; }
        button { padding: .55rem .8rem; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: .55rem; border-bottom: 1px solid #e4e8ec; }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: .7rem; margin: .4rem 0; background: #e9f4ff; border-radius: .35rem; }
        .muted { color: #5a6672; }
        @media (max-width: 650px) { table { display: block; overflow-x: auto; } header { align-items: flex-start; } }
    </style>
</head>
<body>
<header>
    <a href="{% url 'dashboard' %}"><strong>Остатки и заказы</strong></a>
    {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}<button type="submit">Выйти</button>
        </form>
    {% endif %}
</header>
<main>
    {% if messages %}
        <ul class="messages" aria-live="polite">
            {% for message in messages %}<li>{{ message }}</li>{% endfor %}
        </ul>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
